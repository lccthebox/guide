name: Apply guide onboarding improvements v2

on:
  push:
    paths:
      - '.github/workflows/apply-onboarding-20260910-v2.yml'

permissions:
  contents: write

jobs:
  patch-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve academy and study onboarding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          UPDATED = "2026.09.10"

          def add_style(text, css):
              if 'data-guide-onboarding-patch="20260910"' not in text:
                  text = text.replace('</head>', f'''<style data-guide-onboarding-patch="20260910">\n{css}\n</style>\n</head>''', 1)
              return text

          def add_hero_updated(text):
              marker = f'최종 업데이트 · {UPDATED}'
              if marker not in text:
                  text = re.sub(
                      r'(<div class="hero-links">.*?</div>)',
                      rf'\1\n      <div class="guide-updated">{marker}</div>',
                      text,
                      count=1,
                      flags=re.S,
                  )
              return text

          def set_eyebrow(text, section_id, value):
              pattern = rf'(<section id="{re.escape(section_id)}"[^>]*>\s*<(?:p|div) class="sec-eyebrow"[^>]*>)([^<]*)(</(?:p|div)>)'
              return re.sub(pattern, lambda m: m.group(1) + value + m.group(3), text, count=1)

          academy_path = Path('academy.html')
          academy = academy_path.read_text(encoding='utf-8')

          academy_css = r'''
          .guide-updated {
            margin-top: 14px; font-size: 11.5px; color: var(--gray-400); font-weight: 500;
          }
          .onboarding-section {
            background: #f8fbff !important; padding-top: 44px; padding-bottom: 48px;
          }
          .onboarding-head {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
          }
          .onboarding-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--blue); color: #fff; font-size: 10px; font-weight: 800;
            letter-spacing: .08em; padding: 5px 10px; border-radius: 999px;
          }
          .onboarding-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px;
          }
          .onboarding-card {
            display: flex; align-items: center; gap: 14px; min-height: 82px;
            background: #fff; border: 1px solid var(--gray-200); border-radius: 14px;
            padding: 16px 18px; text-decoration: none; color: inherit;
            transition: transform .15s, border-color .15s, box-shadow .15s;
          }
          .onboarding-card:hover {
            transform: translateY(-2px); border-color: #bfdbfe;
            box-shadow: 0 6px 18px rgba(37,99,235,.08);
          }
          .onboarding-num {
            width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--blue-light); color: var(--blue); font-size: 12px; font-weight: 800;
          }
          .onboarding-card strong { display:block; font-size: 13.5px; color: var(--gray-900); margin-bottom: 3px; }
          .onboarding-card small { display:block; font-size: 11.5px; color: var(--gray-500); line-height: 1.5; }
          .onboarding-arrow { margin-left: auto; color: var(--blue); font-weight: 700; }
          .schedule-current-notice {
            background: var(--blue-light); border: 1px solid #bfdbfe; border-radius: 14px;
            padding: 18px 20px; margin-bottom: 16px; font-size: 13px; color: var(--gray-700); line-height: 1.7;
          }
          .schedule-current-notice strong { color: var(--blue); }
          @media(max-width:860px) {
            .onboarding-grid { grid-template-columns: 1fr; }
            .onboarding-section { padding-top: 32px; padding-bottom: 36px; }
          }
          @media(max-width:480px) {
            .hero h2 { font-size: 26px !important; line-height: 1.12 !important; letter-spacing: -.04em !important; }
            .onboarding-card { min-height: 74px; padding: 14px; }
            .onboarding-card strong { font-size: 13px; }
          }
          '''
          academy = add_style(academy, academy_css)
          academy = academy.replace('<h2 style="font-size:58px;', '<h2 style="', 1)
          academy = academy.replace(
              '이 가이드에는 더박스와 함께하시면서 필요한 정보가 담겨 있습니다. 편하게 읽어보시고, 궁금한 점은 언제든지 카카오톡으로 문의해 주시거나 6층으로 방문해 주세요.',
              '등록이 완료되었습니다. 첫 수업 전 아래 체크리스트부터 확인해 주세요. 상세 수강 규정과 시설 안내도 이 페이지에서 확인하실 수 있습니다.',
              1,
          )
          academy = add_hero_updated(academy)

          if 'href="#start-here"' not in academy:
              academy = academy.replace(
                  '<p class="nav-section-label">안내 목차</p>',
                  '<p class="nav-section-label">안내 목차</p>\n    <a href="#start-here" class="nav-link"><span class="ico">✅</span>등록 후 지금 할 일</a>',
                  1,
              )

          academy_onboarding = r'''
          <!-- START HERE · 등록 후 체크리스트 -->
          <section id="start-here" class="onboarding-section">
            <div class="onboarding-head"><span class="onboarding-badge">START HERE</span></div>
            <h2 class="sec-title">첫 수업 전, 이것만 확인해주세요</h2>
            <p class="sec-sub" style="margin-bottom:0;">등록은 완료되었습니다. 아래 순서대로 확인하면 첫 수업 준비가 끝납니다.</p>
            <div class="onboarding-grid">
              <a href="#teachers" class="onboarding-card">
                <span class="onboarding-num">1</span>
                <span><strong>내 수업 · 강의실 확인</strong><small>담당 선생님과 강의실을 먼저 확인해 주세요.</small></span>
                <span class="onboarding-arrow">→</span>
              </a>
              <a href="#schedule" class="onboarding-card">
                <span class="onboarding-num">2</span>
                <span><strong>첫 수업 날짜 · 시간 확인</strong><small>최신 수업 일정과 시간표를 확인해 주세요.</small></span>
                <span class="onboarding-arrow">→</span>
              </a>
              <a href="#attendance" class="onboarding-card">
                <span class="onboarding-num">3</span>
                <span><strong>결석 · 보강 방법 확인</strong><small>수업 및 담당 선생님에 따라 안내 방법이 다릅니다.</small></span>
                <span class="onboarding-arrow">→</span>
              </a>
              <a href="#facility" class="onboarding-card">
                <span class="onboarding-num">4</span>
                <span><strong>노트 · 멤버십 카드 확인</strong><small>수령 위치와 수강생 제공 서비스를 확인해 주세요.</small></span>
                <span class="onboarding-arrow">→</span>
              </a>
              <a href="http://pf.kakao.com/_lJpxjT/chat" target="_blank" class="onboarding-card">
                <span class="onboarding-num">5</span>
                <span><strong>문의 방법 확인</strong><small>궁금한 점은 카카오톡 또는 6층 데스크로 문의해 주세요.</small></span>
                <span class="onboarding-arrow">→</span>
              </a>
            </div>
          </section>

          '''
          if 'id="start-here"' not in academy:
              academy = academy.replace('  <!-- 01 선생님 -->', academy_onboarding + '  <!-- 01 선생님 -->', 1)

          academy = re.sub(
              r'\s*<!-- 전체 시간표 이미지 -->\s*<div class="sched-img-wrap"[^>]*>\s*<img[^>]*schedule\.jpg[^>]*>\s*<div class="sched-zoom-hint">.*?</div>\s*</div>',
              '\n    <div class="schedule-current-notice"><strong>최신 시간표 확인</strong><br>수업 일정은 매월 변경될 수 있습니다. 아래 공식 홈페이지 버튼에서 현재 강의별 시간표를 확인해 주세요.</div>',
              academy,
              count=1,
              flags=re.S,
          )
          academy = academy.replace('<!-- 02.5 · SCHEDULE -->', '<!-- 02 · SCHEDULE -->', 1)
          academy = academy.replace(
              '<div class="fees-method-title">계좌이체 <span class="fees-method-tag">',
              '<div class="fees-method-title">아카데미 수강료 계좌이체 <span class="fees-method-tag">',
              1,
          )

          for section_id, label in {
              'teachers': '01 · TEACHERS',
              'schedule': '02 · SCHEDULE',
              'attendance': '03 · RULES',
              'fees': '04 · TUITION',
              'facility': '05 · FACILITIES',
              'clubs': '06 · THEBOX GO!',
              'faq': '07 · FAQ',
          }.items():
              academy = set_eyebrow(academy, section_id, label)

          academy_path.write_text(academy, encoding='utf-8')

          study_path = Path('study.html')
          study = study_path.read_text(encoding='utf-8')

          study_css = r'''
          .guide-updated {
            margin-top: 14px; font-size: 11.5px; color: var(--gray-400); font-weight: 500;
          }
          #howto { background: #fffafa !important; }
          .onboarding-done {
            display: flex; align-items: center; gap: 10px;
            background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 12px;
            padding: 13px 16px; margin: 18px 0 8px; color: #166534;
            font-size: 12.5px; font-weight: 600;
          }
          .onboarding-done-icon {
            width: 26px; height: 26px; border-radius: 50%; background: #16a34a; color: #fff;
            display: inline-flex; align-items: center; justify-content: center; flex: 0 0 26px; font-weight: 800;
          }
          .step-action-btn {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
            background: var(--red); color: #fff; text-decoration: none; border-radius: 9px;
            padding: 9px 14px; font-size: 12px; font-weight: 700;
          }
          .step-action-btn:hover { background: var(--red-dark); }
          .onboarding-after-note {
            margin-top: 18px; padding: 13px 16px; background: #fff; border: 1px solid var(--gray-200);
            border-radius: 10px; font-size: 12px; color: var(--gray-500); line-height: 1.7;
          }
          @media(max-width:480px) {
            .hero h2 { font-size: 27px !important; line-height: 1.12 !important; }
            .step-row { gap: 14px; }
            .step-action-btn { width: 100%; justify-content: center; box-sizing: border-box; }
          }
          '''
          study = add_style(study, study_css)
          study = study.replace(
              '이 가이드에는 원어민 회화스터디를 즐겁게 참여하시는 데 필요한 정보가 담겨 있습니다. 편하게 읽어보시고, 궁금한 점은 언제든지 카카오톡으로 문의해 주세요.',
              '등록이 완료되었습니다. 첫 참여 전 네이버 카페 가입과 오늘의 테이블 확인 방법부터 먼저 확인해 주세요.',
              1,
          )
          study = add_hero_updated(study)
          study = study.replace(
              '<a href="#howto"    class="nav-link"><span class="ico">🚀</span>참여 방법</a>',
              '<a href="#howto"    class="nav-link"><span class="ico">✅</span>처음 할 일</a>',
              1,
          )

          study_howto = r'''    <!-- 01 등록 후 처음 할 일 -->
              <section id="howto">
                <div class="sec-eyebrow">01 · START HERE</div>
                <h2 class="sec-title">첫 참여 전, 이것만 확인해주세요</h2>
                <p class="sec-sub">상담 및 그룹 배정은 완료되었습니다. 이제 아래 순서대로 준비해 주세요.</p>
                <div class="onboarding-done">
                  <span class="onboarding-done-icon">✓</span>
                  <span>완료된 단계 · 레벨 상담 및 그룹 배정</span>
                </div>
                <div class="steps-wrap">
                  <div class="step-row">
                    <div class="step-num">1</div>
                    <div class="step-content">
                      <h4>네이버 카페 가입 &amp; 등업</h4>
                      <p>더박스 공식 카페에 가입 후 게시판에 <strong>성함 / 연락처 뒷번호 4자리 / 수강하시는 반</strong>을 작성해 주세요. 등업 후 홀딩 신청 및 토픽 확인이 가능합니다.</p>
                      <a href="https://cafe.naver.com/theboxis" target="_blank" class="step-action-btn">☕ 네이버 카페 가입하기 →</a>
                    </div>
                  </div>
                  <div class="step-row">
                    <div class="step-num">2</div>
                    <div class="step-content">
                      <h4>참여 당일 · Where to go Today? 확인</h4>
                      <p>참여하는 날에는 카페에서 본인의 이름을 찾아 <strong>오늘 배정된 테이블</strong>을 확인해 주세요.</p>
                      <span class="step-tag">🅻 Lobby</span>
                      <span class="step-tag" style="margin-left:6px;">🅐 Room A</span>
                      <span class="step-tag" style="margin-left:6px;">🅑 Room B</span><br>
                      <a href="https://cafe.naver.com/theboxis" target="_blank" class="step-action-btn">오늘의 테이블 확인하기 →</a>
                    </div>
                  </div>
                  <div class="step-row">
                    <div class="step-num">3</div>
                    <div class="step-content">
                      <h4>첫 스터디 참여</h4>
                      <p>확인한 테이블로 이동해 스터디에 참여해 주세요. 처음 오셨다면 위치가 헷갈릴 수 있으니 6층 데스크에 문의해 주세요.</p>
                      <span class="step-tag">📍 6층</span>
                    </div>
                  </div>
                  <div class="step-row">
                    <div class="step-num">4</div>
                    <div class="step-content">
                      <h4>단체 카카오톡 초대 확인</h4>
                      <p>첫 참여 후 리더님께서 반 단체 카카오톡에 초대해 드립니다. 이후 공지와 토픽 안내를 단체 톡에서 확인해 주세요.</p>
                      <a href="https://www.instagram.com/thebox_daegu/" target="_blank" class="step-link">📸 @thebox_daegu 공지도 확인하기 →</a>
                    </div>
                  </div>
                </div>
                <div class="onboarding-after-note">💡 <strong>수강 중 레벨 또는 그룹 변경이 필요하다면</strong> 언제든지 6층 매니저에게 말씀해 주세요.</div>
              </section>'''

          study = re.sub(
              r'\s*<!-- 01 참여 방법 -->\s*<section id="howto">.*?</section>',
              '\n\n' + study_howto,
              study,
              count=1,
              flags=re.S,
          )
          study = study.replace(
              '<div class="fees-method-title">계좌이체 <span style=',
              '<div class="fees-method-title">원어민회화스터디 수강료 계좌이체 <span style=',
              1,
          )

          for section_id, label in {
              'howto': '01 · START HERE',
              'schedule': '02 · SCHEDULE',
              'etiquette': '03 · ETIQUETTE',
              'holding': '04 · HOLDING',
              'fees': '05 · FEES',
              'facility': '06 · FACILITY',
              'clubs': '07 · THEBOX GO!',
              'faq': '08 · FAQ',
          }.items():
              study = set_eyebrow(study, section_id, label)

          study_path.write_text(study, encoding='utf-8')

          academy_check = academy_path.read_text(encoding='utf-8')
          study_check = study_path.read_text(encoding='utf-8')
          checks = {
              'academy start section': 'id="start-here"' in academy_check,
              'academy visible numbering': '<p class="sec-eyebrow">02.5 · SCHEDULE</p>' not in academy_check,
              'academy stale schedule image': 'alt="3월 수업 시간표"' not in academy_check,
              'academy checklist': '첫 수업 전, 이것만 확인해주세요' in academy_check,
              'academy account label': '아카데미 수강료 계좌이체' in academy_check,
              'study completed status': '완료된 단계 · 레벨 상담 및 그룹 배정' in study_check,
              'study table button': '오늘의 테이블 확인하기' in study_check,
              'study account label': '원어민회화스터디 수강료 계좌이체' in study_check,
              'academy update date': f'최종 업데이트 · {UPDATED}' in academy_check,
              'study update date': f'최종 업데이트 · {UPDATED}' in study_check,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Failed checks: ' + ', '.join(failed))
          print('All guide checks passed')
          PY

          git diff --check

      - name: Commit guide changes and remove one-time workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-onboarding-20260910.yml
          rm -f .github/workflows/apply-onboarding-20260910-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy.html study.html .github/workflows/apply-onboarding-20260910.yml .github/workflows/apply-onboarding-20260910-v2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Improve registration guide onboarding [skip ci]"
          git push
