name: Update academy teacher link

on:
  push:
    paths:
      - '.github/workflows/update-academy-teacher-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('academy.html')
          s = p.read_text(encoding='utf-8')
          old = '<button class="tlc-btn" onclick="showTeachers()">'
          new = '<button class="tlc-btn" onclick="window.open(\'https://theboxis.com/thebox/academy/\', \'_blank\')">'
          if old not in s:
              raise SystemExit('target button not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          assert 'https://theboxis.com/thebox/academy/' in s
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/update-academy-teacher-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy.html .github/workflows/update-academy-teacher-link.yml
          git commit -m "Update academy teacher guide link [skip ci]"
          git push
